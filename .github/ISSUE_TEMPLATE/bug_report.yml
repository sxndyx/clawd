name: Bug report
description: Something about Clawd isn't working right.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. A screenshot or short screen recording helps a lot.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect to happen instead?
      placeholder: When Claude finished, Clawd kept the scene going instead of celebrating.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can I make it happen?
      placeholder: |
        1. Start a focus session
        2. Send a prompt in Claude Code
        3. ...
  - type: input
    id: version
    attributes:
      label: Clawd version
      description: Shown under Updates in Clawd's menu.
      placeholder: "0.9"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.3, MacBook Air M2
  - type: dropdown
    id: where
    attributes:
      label: Where are you using Claude Code?
      multiple: true
      options:
        - Terminal
        - iTerm2
        - Another terminal (Ghostty, Warp, ...)
        - VS Code or another editor
        - The Claude app (Code tab)
        - Claude app chats
  - type: textarea
    id: more
    attributes:
      label: Screenshots or anything else
